server {
    # Hardened reverse proxy for the public entrypoint. The directives below are
    # tuned for security: they hide version info, cap request body size, add
    # common HTTP security headers, and forward logs to stdout/stderr so Azure
    # Container Apps can ship them to Log Analytics.
    listen 80;
    server_name localhost;

    server_tokens off;
    client_max_body_size 10m;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Frontend
    location / {
        proxy_pass http://frontend:5174;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
