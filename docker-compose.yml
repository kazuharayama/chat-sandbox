services:
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
      target: development
    ports:
      - "5174:5174"  # そのまま
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend:8000
      # Langfuse接続用の環境変数を追加
      - VITE_LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - VITE_LANGFUSE_HOST=${LANGFUSE_HOST:-http://localhost:3000}
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
      target: development
    ports:
      - "8000:8000"  # そのまま
    volumes:
      - ./backend:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Langfuse設定を追加
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://host.docker.internal:3000}
      # PostgreSQL接続設定
      - DATABASE_URL=postgresql://chat_user:chat_pass@postgres:5432/chat_db
      - DB_HOST=postgres
      - DB_USER=chat_user
      - DB_PASSWORD=chat_pass
      - DB_NAME=chat_db
      - DB_PORT=5432
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: chat_postgres_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: chat_pass
      POSTGRES_DB: chat_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_user -d chat_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    ports:
      - "8080:80"  # 80 → 8080 に変更（競合回避）
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:

# Langfuseは外部で起動済みのため、デフォルトネットワークを使用
