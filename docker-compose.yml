services:
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
      target: development
    ports:
      - "5174:5174"  # そのまま
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend:8000
      # Langfuse接続用の環境変数を追加
      - VITE_LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - VITE_LANGFUSE_HOST=${LANGFUSE_HOST:-http://localhost:3000}
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
      target: development
    ports:
      - "8000:8000"  # そのまま
    volumes:
      - ./backend:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Langfuse設定を追加
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://host.docker.internal:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # depends_on:
    #   - langfuse-web  # Langfuseが先に起動するように
    # external_links:
    #   - langfuse-web:langfuse

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    ports:
      - "8080:80"  # 80 → 8080 に変更（競合回避）
    depends_on:
      - frontend
      - backend

# Langfuseは外部で起動済みのため、デフォルトネットワークを使用
